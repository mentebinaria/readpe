---
prog: "readpe"
help: "Read PE file headers and meta information"
positionals:
- number: 1
  complete: ["file"]
  capture: "READPE"
options:
- option_strings: ["-f", "--format"]
  metavar: "FORMAT"
  help: "Set output format"
  complete: ["exec", "readpe --get-output-plugins"]
- option_strings: ["--file-version"]
  help: "Show PE file version"
  final: true
- option_strings: ["-h", "--help"]
  help: "Print this message"
  final: true
- option_strings: ["-v", "--version"]
  help: "Print program version"
  final: true
- option_strings: ["--get-output-plugins"]
  help: "Print available output plugins"
  final: true
  hidden: true
---
prog: "readpe header"
options: &EXTENDED
- option_strings: ["-a", "--all"]
  help: "Print all headers"
- option_strings: ["-f", "--format"]
