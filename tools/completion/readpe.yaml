- option_strings: ["-h", "--help"]
  help: "Print this message"
  final: true
- option_strings: ["-l", "--list"]
  help: "Print list of present headers"
- option_strings: ["-v", "--verbose"]
  help: "Print more verbose"
  final: true
- option_strings: ["-V", "--version"]
  help: "Print program version"
  final: true
